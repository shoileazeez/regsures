services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.production
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    networks: [regsure]

  eve:
    build:
      context: ./work-agent
      dockerfile: Dockerfile
    env_file: ./work-agent/.env.production
    restart: unless-stopped
    ports:
      - "127.0.0.1:2000:2000"
    networks: [regsure]

  whatsapp:
    build:
      context: ./work-agent
      dockerfile: Dockerfile
    command: ["npm", "run", "whatsapp"]
    env_file: ./work-agent/.env.production
    restart: unless-stopped
    depends_on: [eve]
    networks: [regsure]

networks:
  regsure:
    name: regsure-production
