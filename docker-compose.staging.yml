services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    networks: [regsure-staging]

  eve:
    build:
      context: ./work-agent
      dockerfile: Dockerfile
    env_file: ./work-agent/.env.staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:2100:2000"
    networks: [regsure-staging]

  whatsapp:
    build:
      context: ./work-agent
      dockerfile: Dockerfile
    command: ["npm", "run", "whatsapp"]
    env_file: ./work-agent/.env.staging
    restart: unless-stopped
    depends_on: [eve]
    networks: [regsure-staging]

networks:
  regsure-staging:
    name: regsure-staging
